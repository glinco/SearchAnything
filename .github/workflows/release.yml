# Pushing a tag like v0.1.0 builds the downloads and publishes them as a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; only the publish job below can write.
permissions:
  contents: read

jobs:
  # Tests and third-party packages run here, with a token that can't change the repo or its releases.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test SearchAnything.slnx -c Release

      - name: Build single-file downloads
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/SearchAnything/SearchAnything.csproj -c Release -r $rid -p:Version=$version -o "publish/$rid"
            Copy-Item "publish/$rid/SearchAnything.exe" "SearchAnything-$rid.exe"
          }
          Get-FileHash SearchAnything-*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            SearchAnything-win-x64.exe
            SearchAnything-win-arm64.exe
            SHA256SUMS.txt
          if-no-files-found: error

  # Only this job can publish. The "release" environment can require a reviewer's approval first.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      # Lets anyone check a download came from this workflow: gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            SearchAnything-win-x64.exe
            SearchAnything-win-arm64.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          SearchAnything-win-x64.exe SearchAnything-win-arm64.exe SHA256SUMS.txt
          --title "SearchAnything $GITHUB_REF_NAME"
          --generate-notes
